<!-- 창업 리스닝 — 화면과 동작. 인물·챕터는 data/people.js + data/people/{id}.js (규칙은 CLAUDE.md) -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-O74Mkfbi2O4TiRrEUeNTafrr9E6EnAQinxW+ViG1/Dw='; style-src 'unsafe-inline'; connect-src 'self' https://api.elevenlabs.io; media-src blob:; img-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F5F3EE" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<title>창업 리스닝</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    color-scheme: dark;
    --bg:#121417;
    --bg-2:#1A1D21;
    --bg-3:#23272D;
    --text:#ECE9E4;
    --text-2:#C9CBCF;
    --muted:#A1A7B0;
    --faint:#8C939C;
    --line:rgba(255,255,255,.08);
    --card:#1F2328;
    --accent:#E7B86A;
    --accent-soft:rgba(231,184,106,.11);
    --accent-line:rgba(231,184,106,.45);
    --on-accent:#2A1D06;
    --warn:#E8A57A;
    --warn-soft:rgba(232,165,122,.12);
    --mark:rgba(231,184,106,.24);
    --toast:#2B3036;
    --pad:20px;
    --tz:1;               /* 글자 크기(설정) — applyTextZoom이 바꿈 */
  }
  @media (prefers-color-scheme: light){
    :root{
      color-scheme: light;
      --bg:#F5F3EE;
      --bg-2:#ECE9E2;
      --bg-3:#E2DED5;
      --text:#1F2226;
      --text-2:#3B3F45;
      --muted:#5E646C;
      --faint:#5F646B;
      --line:rgba(0,0,0,.09);
      --card:#FFFFFF;
      --accent:#8A5A12;
      --accent-soft:rgba(138,90,18,.07);
      --accent-line:rgba(138,90,18,.4);
      --on-accent:#FFFFFF;
      --warn:#9A4A15;
      --warn-soft:rgba(154,74,21,.08);
      --mark:rgba(138,90,18,.15);
    }
  }
  @media (max-width:370px){ :root{ --pad:18px; } }

  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden; overscroll-behavior:none; -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  body{
    font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
    font-size:17px; line-height:1.55; -webkit-tap-highlight-color:transparent; touch-action:manipulation;
    word-break:keep-all; overflow-wrap:break-word;
  }
  button{ font:inherit; color:inherit; background:none; border:0; padding:0; margin:0; cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation; -webkit-user-select:none; user-select:none; }
  button:focus{ outline:none; }
  button:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
  button:disabled{ cursor:default; opacity:.45; }
  svg{ display:block; }
  textarea, input{ font:inherit; color:var(--text); }
  textarea::placeholder, input::placeholder{ color:var(--faint); }

  /* ---------- 앱 틀: 홈(인물 목록) 한 화면 + 전체 화면(인물·챕터·설정) ---------- */
  .app{ height:100vh; height:100dvh; }
  .view{ height:100%; overflow-y:auto; overflow-x:hidden; overscroll-behavior-y:contain; }
  .page{ padding:calc(env(safe-area-inset-top, 0px) + 14px) max(var(--pad), env(safe-area-inset-right)) 32px max(var(--pad), env(safe-area-inset-left)); }
  .head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px; }
  .head h1{ margin:0; font-size:24px; font-weight:800; letter-spacing:-.01em; }
  .gear{ flex:none; width:44px; height:44px; margin:-6px -10px -6px 0; border-radius:12px; display:flex; align-items:center; justify-content:center; color:var(--muted); }
  .gear svg{ width:22px; height:22px; }
  .sec-t{ margin:22px 2px 10px; font-size:13px; font-weight:700; letter-spacing:.04em; color:var(--faint); }
  .note{ margin:8px 2px 0; font-size:14px; line-height:1.6; color:var(--faint); }

  /* 큰 버튼(화면마다 하나) · 보조 버튼 */
  .go{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:56px; padding:12px 18px; border-radius:16px; background:var(--accent); color:var(--on-accent); font-size:17.5px; font-weight:750; text-align:center; }
  .go svg{ width:20px; height:20px; flex:none; }
  .go:active{ transform:scale(.985); }
  .outline-btn{ display:flex; align-items:center; justify-content:center; gap:7px; width:100%; min-height:48px; margin-top:10px; padding:8px 14px; border-radius:14px; border:1.5px solid var(--line); background:var(--card); font-size:15.5px; font-weight:650; color:var(--text-2); }
  .outline-btn svg{ width:18px; height:18px; flex:none; }
  .outline-btn.playing{ border-color:var(--accent); color:var(--accent); }
  .outline-btn.danger{ color:var(--warn); }
  .seg{ display:flex; gap:3px; padding:3px; border-radius:13px; background:var(--bg-2); border:1px solid var(--line); }
  .seg button{ flex:1; min-height:44px; border-radius:10px; font-size:15px; color:var(--muted); }
  .seg button[aria-pressed="true"]{ background:var(--card); color:var(--text); font-weight:700; box-shadow:0 1px 3px rgba(0,0,0,.18); }

  /* ---------- 홈: 이어 하기 · 인물 카드 ---------- */
  .resume{ display:block; width:100%; margin-bottom:6px; padding:16px; border-radius:18px; background:var(--accent-soft); border:1px solid var(--accent-line); text-align:left; }
  .resume-k{ display:block; font-size:13px; font-weight:700; letter-spacing:.04em; color:var(--accent); }
  .resume-t{ display:block; margin:4px 0 2px; font-size:18px; font-weight:750; line-height:1.4; }
  .resume-s{ display:block; font-size:14px; color:var(--muted); }
  .pp{ display:flex; gap:14px; align-items:flex-start; width:100%; margin-bottom:10px; padding:16px; border-radius:18px; background:var(--card); border:1.5px solid var(--line); text-align:left; }
  .pp-emo{ flex:none; width:48px; height:48px; border-radius:14px; background:var(--bg-2); display:flex; align-items:center; justify-content:center; font-size:26px; }
  .pp-b{ flex:1; min-width:0; }
  .pp-n{ display:block; font-size:18px; font-weight:750; }
  .pp-c{ display:block; font-size:14px; color:var(--muted); }
  .pp-i{ display:block; margin-top:6px; font-size:14px; line-height:1.5; color:var(--text-2); }
  .pp-p{ display:block; margin-top:8px; font-size:13px; font-weight:650; color:var(--faint); font-variant-numeric:tabular-nums; }

  /* ---------- 전체 화면 공통 ---------- */
  .full{ position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; background:var(--bg); }
  .full[hidden]{ display:none; }
  #chap{ z-index:30; }
  #settings{ z-index:35; }
  .f-top{ flex:none; display:flex; align-items:center; gap:6px; padding:calc(env(safe-area-inset-top, 0px) + 6px) max(10px, env(safe-area-inset-right)) 4px max(6px, env(safe-area-inset-left)); }
  .f-x{ flex:none; width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; color:var(--muted); }
  .f-x svg{ width:22px; height:22px; }
  .f-title{ flex:1; min-width:0; font-size:15px; font-weight:700; color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .f-body{ flex:1; min-height:0; overflow-y:auto; overscroll-behavior-y:contain; padding:10px max(var(--pad), env(safe-area-inset-right)) 28px max(var(--pad), env(safe-area-inset-left)); }
  .f-foot{ flex:none; padding:8px max(var(--pad), env(safe-area-inset-right)) calc(env(safe-area-inset-bottom, 0px) + 10px) max(var(--pad), env(safe-area-inset-left)); border-top:1px solid var(--line); background:var(--bg); }

  /* ---------- 인물 화면 ---------- */
  .ph{ display:flex; gap:14px; align-items:center; margin:4px 0 6px; }
  .ph .pp-emo{ width:56px; height:56px; font-size:30px; }
  .ph-n{ margin:0; font-size:22px; font-weight:800; }
  .ph-c{ font-size:14.5px; color:var(--muted); }
  .chl{ display:flex; flex-direction:column; gap:10px; }
  .ch{ display:flex; align-items:center; gap:12px; width:100%; min-height:64px; padding:14px 16px; border-radius:16px; background:var(--card); border:1.5px solid var(--line); text-align:left; }
  .ch:disabled{ opacity:1; background:transparent; border-style:dashed; }
  .ch-no{ flex:none; width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--bg-2); font-size:15px; font-weight:750; color:var(--muted); font-variant-numeric:tabular-nums; }
  .ch.done .ch-no{ background:var(--accent); color:var(--on-accent); }
  .ch-no svg{ width:18px; height:18px; }
  .ch-b{ flex:1; min-width:0; }
  .ch-t{ display:block; font-size:16.5px; font-weight:700; line-height:1.4; }
  .ch-k{ display:block; font-size:14px; color:var(--muted); }
  .ch-s{ flex:none; font-size:12.5px; font-weight:700; padding:4px 9px; border-radius:999px; background:var(--bg-2); color:var(--muted); }
  .ch.done .ch-s{ background:var(--accent-soft); color:var(--accent); }
  .ch:disabled .ch-t, .ch:disabled .ch-no{ color:var(--faint); }

  /* ---------- 챕터 화면: 단계 막대 ---------- */
  .steps{ flex:none; display:flex; gap:4px; padding:0 max(var(--pad), env(safe-area-inset-right)) 4px max(var(--pad), env(safe-area-inset-left)); }
  .stp{ flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:5px; min-height:44px; justify-content:center; padding:4px 0; font-size:12.5px; font-weight:650; color:var(--faint); }
  .stp::before{ content:""; display:block; width:100%; height:4px; border-radius:2px; background:var(--bg-3); }
  .stp.reached::before{ background:var(--accent-line); }
  .stp.reached{ color:var(--muted); }
  .stp.cur{ color:var(--text); font-weight:800; }
  .stp.cur::before{ background:var(--accent); }
  .stp:disabled{ opacity:1; }
  .stp .lk{ display:inline-flex; align-items:center; gap:3px; }
  .stp .lk svg{ width:12px; height:12px; }

  .lead{ margin:6px 2px 14px; font-size:15px; line-height:1.6; color:var(--text-2); }
  .done-badge{ display:flex; align-items:center; gap:6px; margin:4px 0 12px; padding:10px 14px; border-radius:14px; background:var(--accent-soft); color:var(--accent); font-size:14.5px; font-weight:700; }
  .done-badge svg{ width:18px; height:18px; }
  .fld-l{ display:flex; justify-content:space-between; align-items:baseline; margin:18px 2px 8px; font-size:14px; font-weight:700; color:var(--text-2); }
  .fld-l small{ font-size:12.5px; font-weight:600; color:var(--faint); font-variant-numeric:tabular-nums; }
  .ta{ display:block; width:100%; min-height:150px; padding:12px 14px; border-radius:14px; border:1px solid var(--line); background:var(--card); font-size:16px; line-height:1.6; resize:vertical; }
  .ta:focus{ outline:2px solid var(--accent-line); outline-offset:0; }
  .ta.sm{ min-height:88px; }
  .stage-go{ margin-top:22px; }
  .hint{ margin:8px 2px 0; font-size:13.5px; color:var(--faint); text-align:center; }

  /* ---------- 2단계: 스크립트(문장마다 줄) ---------- */
  .tools{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:2px 0 6px; }
  .tg{ display:inline-flex; align-items:center; gap:6px; min-height:44px; padding:6px 14px; border-radius:12px; border:1.5px solid var(--line); background:var(--card); font-size:14.5px; font-weight:650; color:var(--text-2); }
  .tg svg{ width:17px; height:17px; }
  .tg[aria-pressed="true"]{ border-color:var(--accent); color:var(--accent); }
  .mk-box{ margin:10px 0 4px; padding:12px; border-radius:16px; background:var(--bg-2); }
  .mk-box .mk-row{ display:flex; gap:8px; align-items:center; }
  .mk-box .seg{ flex:none; width:132px; }
  .mk-box .mk-go{ flex:1; min-width:0; min-height:48px; margin:0; }
  .mk-box .note{ margin-top:8px; }
  .para{ margin-top:14px; padding-top:12px; border-top:1px solid var(--line); }
  .para:first-of-type{ border-top:0; padding-top:4px; }
  .sn{ display:flex; gap:6px; align-items:flex-start; margin:2px -6px; padding:4px 0 4px 6px; border-radius:12px; border-left:3px solid transparent; }
  .sn.on{ background:var(--bg-2); }
  .sn.marked{ border-left-color:var(--accent); background:var(--accent-soft); }
  .sn-t{ flex:1; min-width:0; padding:6px 2px; font-size:calc(18px * var(--tz)); line-height:1.6; cursor:pointer; }
  .sn.tapped .sn-t{ animation:snTap .8s ease-out; border-radius:8px; }
  @keyframes snTap{ 0%, 40%{ background:var(--mark); } 100%{ background:transparent; } }
  .ck{ flex:none; width:44px; min-height:44px; border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; color:var(--faint); font-size:10.5px; font-weight:700; }
  .ck svg{ width:22px; height:22px; }
  .ck[aria-pressed="true"]{ color:var(--accent); }

  /* ---------- 노래방 강조 (영어일기·한 장 영어와 같음): .sc(문장) > .w(단어) ---------- */
  .sc .w{ transition:opacity .22s ease, text-shadow .22s ease; }
  .sc.reading .w{ opacity:.38; }
  .sc.reading .w.past, .sc.reading .w.now, .sc.reading.filled .w{ opacity:1; text-shadow:.3px 0 currentColor, -.3px 0 currentColor; }
  .sc.reading.lineonly .w{ opacity:1; }
  .sc.reading.lineonly{ background:var(--mark); box-shadow:0 0 0 2px var(--mark); border-radius:4px; -webkit-box-decoration-break:clone; box-decoration-break:clone; }

  /* ---------- 3단계: 질문 ---------- */
  .qc{ margin-top:14px; padding:14px; border-radius:16px; background:var(--card); border:1px solid var(--line); }
  .qc-h{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .qc-no{ font-size:13px; font-weight:800; color:var(--accent); }
  .qc-tag{ font-size:12px; font-weight:700; padding:2px 8px; border-radius:999px; border:1px solid var(--accent-line); color:var(--text-2); }
  .qc-en{ font-size:calc(17.5px * var(--tz)); font-weight:650; line-height:1.5; }
  .qc-ko{ margin-top:4px; font-size:calc(15px * var(--tz)); color:var(--muted); line-height:1.5; }
  .qc-kob{ min-height:44px; margin:2px 0 6px -4px; padding:0 4px; font-size:14px; font-weight:650; color:var(--accent); }

  /* ---------- 재생기(챕터 화면 아래) ---------- */
  .pl-ask{ margin-bottom:8px; padding:12px; border-radius:14px; background:var(--bg-2); font-size:14.5px; line-height:1.55; color:var(--text-2); }
  .pl-ask .row{ display:flex; gap:8px; margin-top:10px; }
  .pl-ask .row button{ flex:1; min-height:44px; border-radius:12px; font-size:14.5px; font-weight:700; }
  .pl-ask .yes{ background:var(--accent); color:var(--on-accent); }
  .pl-ask .no{ border:1.5px solid var(--line); background:var(--card); color:var(--text-2); }
  .pl-st{ min-height:20px; margin:0 2px 4px; font-size:13.5px; font-weight:650; color:var(--muted); text-align:center; }
  .pl-st.mk{ color:var(--accent); }
  .pl-bar{ display:flex; align-items:center; gap:10px; font-size:13px; color:var(--faint); font-variant-numeric:tabular-nums; }
  .pl-bar span{ flex:none; min-width:40px; }
  .pl-bar span:last-child{ text-align:right; }
  .pl-r{ flex:1; min-width:0; height:44px; margin:0; accent-color:var(--accent); background:transparent; }
  .pl-row{ display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .pl-b{ width:52px; height:48px; border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--text-2); font-size:11px; font-weight:700; line-height:1.1; }
  .pl-b svg{ width:24px; height:24px; }
  .pl-play{ width:64px; height:56px; border-radius:18px; background:var(--accent); color:var(--on-accent); display:flex; align-items:center; justify-content:center; }
  .pl-play svg{ width:28px; height:28px; }
  .pl-rate{ min-width:60px; height:48px; padding:0 10px; border-radius:14px; border:1.5px solid var(--line); font-size:15px; font-weight:750; color:var(--text-2); font-variant-numeric:tabular-nums; }
  .pl-stop{ min-height:44px; padding:0 14px; border-radius:12px; border:1.5px solid var(--accent-line); font-size:14.5px; font-weight:700; color:var(--accent); }

  /* ---------- 설정 ---------- */
  .st-sec h2{ margin:8px 2px 4px; font-size:19px; font-weight:800; }
  .st-l{ display:block; margin:20px 2px 8px; font-size:13px; font-weight:700; letter-spacing:.03em; color:var(--faint); }
  .key-row{ display:flex; gap:8px; }
  .key-row .sub-btn{ flex:none; min-width:64px; min-height:48px; border-radius:12px; color:var(--accent); font-size:15px; font-weight:650; }
  .inp, .sel{ display:block; width:100%; min-height:48px; padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:var(--card); font-size:16px; }
  .key-row .inp{ flex:1; min-width:0; font-family:ui-monospace,Consolas,monospace; font-size:15px; }
  .inp.masked{ -webkit-text-security:disc; text-security:disc; }
  .key-row .inp::placeholder{ font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif; -webkit-text-security:none; }
  .inp:focus, .sel:focus{ outline:2px solid var(--accent-line); outline-offset:0; }
  .key-state{ margin:8px 2px 0; font-size:13.5px; color:var(--faint); }
  .key-state b{ color:var(--accent); }
  .tz-prev{ margin-top:12px; padding:14px; border-radius:14px; background:var(--bg-2); font-size:calc(18px * var(--tz)); line-height:1.55; }

  /* ---------- 토스트 · 새 버전 막대 ---------- */
  .toast{ position:fixed; left:50%; z-index:40; bottom:calc(env(safe-area-inset-bottom, 0px) + 150px); max-width:calc(100% - 40px); padding:11px 18px; border-radius:16px; background:var(--toast); color:#F1EFEB; font-size:14.5px; line-height:1.45; text-align:center; box-shadow:0 6px 24px rgba(0,0,0,.3); opacity:0; transform:translate(-50%, 10px); transition:opacity .25s ease, transform .25s ease; pointer-events:none; }
  .toast.on{ opacity:1; transform:translate(-50%, 0); }
  .upd{ position:fixed; z-index:45; left:12px; right:12px; top:calc(env(safe-area-inset-top, 0px) + 8px); display:flex; align-items:center; gap:6px; padding:6px 6px 6px 16px; border-radius:16px; background:var(--toast); color:#F1EFEB; font-size:15px; font-weight:600; box-shadow:0 6px 24px rgba(0,0,0,.3); }
  .upd[hidden]{ display:none; }
  .upd span{ flex:1; min-width:0; }
  .upd button{ flex:none; min-height:44px; padding:0 14px; border-radius:12px; background:#E7B86A; color:#2A1D06; font-size:15px; font-weight:750; }
  .upd .upd-x{ background:transparent; color:#C9CBCF; font-weight:600; padding:0 10px; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<div class="app" id="app">
  <main class="view" id="home" aria-label="인물 목록"><div class="page" id="homePage"></div></main>
</div>

<!-- 인물 화면(챕터 목록) -->
<div class="full" id="person" hidden role="dialog" aria-modal="true" aria-label="챕터 목록">
  <div class="f-top"><button class="f-x" id="pX" aria-label="뒤로"></button><div class="f-title" id="pTitle"></div></div>
  <div class="f-body" id="pBody"></div>
</div>

<!-- 챕터 화면(3단계) -->
<div class="full" id="chap" hidden role="dialog" aria-modal="true" aria-label="챕터">
  <div class="f-top"><button class="f-x" id="cX" aria-label="닫기"></button><div class="f-title" id="cTitle"></div></div>
  <div class="steps" id="cSteps" role="group" aria-label="단계"></div>
  <div class="f-body" id="cBody"></div>
  <div class="f-foot" id="cFoot">
    <div class="pl-ask" id="plAsk" hidden></div>

/* ---------- 데이터: 인물 목록(data/people.js) + 인물 파일(data/people/{id}.js — 시작할 때 읽음) ----------

const PEOPLE_LIST = Array.isArray(window.PEOPLE_LIST) ? window.PEOPLE_LIST : [];

function sentKey(text) { return hashStr(text).toString(36) + "-" + text.length; }
function prepChapter(person, ch) {
  const sents = [], paras = [];
  let text = "";
  (ch.script || []).forEach((para, pi) => {
    const row = [];
    if (text) text += "\n\n";

function progOf(cid) {

/* =====================================================================
   인터랙티브 스크립트 ① 글 준비·그리기 (영어일기에서 가져옴 — 원래 한 장 영어)
   getScript(text) → { id, text, speech(읽을 글), words: [{ pieces, ss, se }], wordAt(읽을 글 위치) }
   scriptHtml(text) → <span class="sc" data-sc="id"> 안에 단어마다 <span class="w" data-w="번호">
   ===================================================================== */
const SCRIPTS = [];
const SCRIPT_BY_TEXT = new Map();
const GLOSS_RE = /\s*\([^()]*[가-힣ㄱ-ㅎㅏ-ㅣ][^()]*\)/g;
function getScript(text) {
  text = String(text || "");
  if (SCRIPT_BY_TEXT.has(text)) return SCRIPT_BY_TEXT.get(text);
  const n = text.length;
  const gloss = new Uint8Array(n);
  GLOSS_RE.lastIndex = 0;
  let m;
  while ((m = GLOSS_RE.exec(text))) for (let i = m.index; i < m.index + m[0].length; i++) gloss[i] = 1;
  const d2s = new Int32Array(n);
  let speech = "";
  for (let i = 0; i < n; i++) {
    if (gloss[i]) { d2s[i] = -1; continue; }
    d2s[i] = speech.length;
    speech += text[i];
  }
  const toks = [];
  let cur = null;
  for (let i = 0; i < n; i++) {
    if (gloss[i] || /\s/.test(text[i])) { cur = null; continue; }
    if (cur) cur.e = i + 1;
    else { cur = { s: i, e: i + 1 }; toks.push(cur); }
  }
  const words = [];
  let lead = [];
  toks.forEach(t => {
    const p = [t.s, t.e];
    if (/[A-Za-z0-9]/.test(text.slice(t.s, t.e))) { words.push({ pieces: lead.concat([p]) }); lead = []; }
    else if (words.length) words[words.length - 1].pieces.push(p);
    else lead.push(p);
  });
  if (lead.length) words.push({ pieces: lead });
  const wAt = new Int32Array(n).fill(-1);
  const sp2w = new Int32Array(speech.length).fill(-1);
  words.forEach((w, k) => {
    w.pieces.forEach(p => { for (let i = p[0]; i < p[1]; i++) { wAt[i] = k; if (d2s[i] >= 0) sp2w[d2s[i]] = k; } });
    w.ss = d2s[w.pieces[0][0]];
    w.se = d2s[w.pieces[w.pieces.length - 1][1] - 1] + 1;
  });
  for (let i = 1; i < sp2w.length; i++) if (sp2w[i] < 0) sp2w[i] = sp2w[i - 1];
  const sc = {
    id: SCRIPTS.length, text, speech, words, wAt, gloss,
    wordAt: i => (i >= 0 && i < sp2w.length ? Math.max(0, sp2w[i]) : (i >= sp2w.length ? words.length - 1 : 0))
  };
  SCRIPTS.push(sc);
  SCRIPT_BY_TEXT.set(text, sc);
  return sc;
}
function scriptHtml(text) {
  const sc = getScript(text);
  const t = sc.text, n = t.length;
  let html = '<span class="sc" data-sc="' + sc.id + '">';
  let curW = -1, curG = 0;
  const closeIn = () => { if (curW >= 0 || curG) html += "</span>"; curW = -1; curG = 0; };
  for (let i = 0; i < n; i++) {
    const w = sc.wAt[i], g = sc.gloss[i];
    if (w !== curW || g !== curG) {
      closeIn();
      if (g) { html += '<span class="gloss">'; curG = 1; }
      else if (w >= 0) { html += '<span class="w" data-w="' + w + '">'; curW = w; }
    }
    html += esc(t[i]);
  }
  closeIn();
  return html + "</span>";
}

/* =====================================================================

   키 = 모델|목소리|읽을 글(폰에서 만든 음성) 또는 "pre|파일 이름"(저장소의 미리 만든 음성 — 한 번 받으면 폰에 둠: 같은 github.io 주소의
   한 장 영어 sw.js가 업데이트 때 다른 앱의 Cache Storage를 지워도 음성은 남게). 값 = { audio: mp3 Blob, align: 글자별 시간 | null }
   ===================================================================== */
const AudioCache = (() => {
  const mem = new Map();
  let dbp = null;
  function db() {
    if (!dbp) {
      dbp = new Promise(res => {
        const giveUp = setTimeout(() => res(null), 1500);   // 저장소가 답이 없으면(일부 비밀 모드·file:// 등) 저장 없이 재생
        try {

  async function playSeg(src, si, my) {

      S.segPaused = !S.segPaused;

    }

    }

  }
  function skip(d) {
    if (S.mode === "marks") return;

/* =====================================================================
   화면 공통: 겹치는 전체 화면(인물 → 챕터 → 설정). 열 때마다 history.pushState → 폰 뒤로가기 = 맨 위 화면만 닫힘
   ===================================================================== */
const LAYERS = [];
function openLayer(el, onClose) {
  LAYERS.push({ el, onClose });
  history.pushState({ layer: LAYERS.length }, "");
  el.hidden = false;
  syncInert();
}
function closeTop() {
  const L = LAYERS.pop();
  if (!L) return;
  L.el.hidden = true;
  if (L.onClose) L.onClose();
  syncInert();
}
function syncInert() {
  $("app").inert = LAYERS.length > 0;
  LAYERS.forEach((L, i) => { L.el.inert = i < LAYERS.length - 1; });
}
addEventListener("popstate", () => {
  const want = (history.state && history.state.layer) || 0;
  while (LAYERS.length > want) closeTop();
});
function closeLayer(el) {
  if (!LAYERS.length || LAYERS[LAYERS.length - 1].el !== el) return;
  if (history.state && history.state.layer === LAYERS.length) history.back(); else closeTop();
}
$("pX").innerHTML = IC.back; $("cX").innerHTML = IC.x; $("sX").innerHTML = IC.x;
$("pX").addEventListener("click", () => closeLayer($("person")));
$("cX").addEventListener("click", () => closeLayer($("chap")));
$("sX").addEventListener("click", () => closeLayer($("settings")));
document.addEventListener("click", e => { if (e.target.closest("[data-open-settings]")) openSettings(); });

/* ---------- 홈: 이어 하기 + 인물 카드 ---------- */

/* ---------- 인물 화면: 챕터 목록(순서와 상관없이 열 수 있음, 아직 안 쓴 챕터는 '준비 중') ---------- */
let curPerson = null;
function renderPerson() {

/* =====================================================================
   챕터 화면 — 단계 1(스크립트 없이 듣기 · 한국어 요약) → 2(스크립트 · 노래방 · 문장 누르기 · 안 들린 문장) → 3(이해력 테스트)
   1·3단계에는 스크립트 글을 화면에 아예 그리지 않음(가리는 게 아니라 넣지 않음)
   ===================================================================== */
const C = { open: false, CH: null, view: 1, kEl: null, kSi: -1, ask: false, askOk: false, doneAsk: false, raf: 0, guard: null };

function openChapter(cid) {
  const CH = CHAPTERS[cid];
  if (!CH) return;
  C.CH = CH; C.open = true; C.ask = false; C.askOk = false; C.doneAsk = false;
  const p = progOf(cid);
  C.view = Math.min(p.stage, 3);
  PROG.last = { pid: CH.pid, cid };
  saveProg();
  AU.open(CH);
  $("cTitle").textContent = CH.person.name + " · Chapter " + CH.no;

  paintPlayer(true);
  openLayer($("chap"), hideChapter);
  loopStart();
}
function hideChapter() {
  AU.close();

  renderHome();
}
function stepsHtml() {
  const st = chapStage(), names = ["듣기", "스크립트", "테스트"];
  return names.map((n, i) => {
    const v = i + 1, open = v <= Math.min(st, 3) || st === 4;
    return '<button class="stp' + (open ? " reached" : "") + (v === C.view ? " cur" : "") + '" data-view="' + v + '"' + (open ? "" : " disabled aria-disabled=\"true\"") +
      (v === C.view ? ' aria-current="step"' : "") + ">" + (open ? v + " " + n : '<span class="lk">' + IC.lock + v + " " + n + "</span>") + "</button>";
  }).join("");
}
function renderChap() {
  const CH = C.CH, p = progOf(CH.id);
  clearKaraoke();
  $("cSteps").innerHTML = stepsHtml();
  const head = '<div class="sec-t" style="margin-top:6px">Chapter ' + CH.no + " · " + esc(CH.title.en) + '<br><span style="letter-spacing:0;font-weight:600">' + esc(CH.title.ko) + "</span></div>";
  const done = p.stage === 4 ? '<div class="done-badge">' + IC.check + "완료한 챕터예요" + (p.doneOn ? " · " + esc(p.doneOn) : "") + "</div>" : "";
  let html = head + done;
  if (C.view === 1) html += view1(CH, p);
  else if (C.view === 2) html += view2(CH, p);
  else html += view3(CH, p);
  $("cBody").innerHTML = html;
  $("cBody").scrollTop = 0;
  if (C.view === 1) sync1();
}
function view1(CH, p) {
  return '<p class="lead">스크립트 없이 끝까지 들어 보세요. 다 듣고 나서 아래에 <b>한국어로 요약</b>을 써요. 여러 번 들어도 돼요.</p>' +
    '<label class="fld-l" for="sumTa">내 한국어 요약 <small id="sumN"></small></label>' +
    '<textarea class="ta" id="sumTa" placeholder="누가, 무엇을, 왜 했는지 들은 대로 써 보세요">' + esc(p.summary) + "</textarea>" +
    '<button class="outline-btn" data-act="copy1">' + IC.copy + "요약 채점 프롬프트 복사</button>" +
    '<p class="note">복사한 글에는 이야기 원문·내 요약·채점 요청이 들어 있어요. ChatGPT 같은 AI에 붙여넣으세요.</p>' +
    '<button class="go stage-go" data-act="to2">' + (p.stage >= 2 ? "2단계 보기 · 스크립트" : "2단계로 · 스크립트 보며 듣기") + IC.arrow + "</button>" +
    '<p class="hint" id="to2Hint"></p>';
}
function sync1() {
  const ta = $("sumTa"), has = !!ta.value.trim();
  $("sumN").textContent = ta.value.trim().length + "자";
  const go = document.querySelector('[data-act="to2"]');
  go.disabled = !has && chapStage() < 2;
  $("to2Hint").textContent = go.disabled ? "요약을 쓰면 2단계가 열려요" : "";
}
function view2(CH, p) {
  const mk = markedIdx(CH);
  let html = '<p class="lead">문장을 누르면 그 문장부터 들어요. 안 들린 문장은 오른쪽 <b>체크</b>를 눌러 두세요.</p>' +

/* ---------- 노래방 강조(2단계 스크립트에서만 · 자막 강조가 켜져 있을 때) ---------- */
function clearKaraoke() {
  if (C.kEl) { C.kEl.classList.remove("reading", "filled", "lineonly"); paintWord(C.kEl, -1); }
  document.querySelectorAll(".sn.on").forEach(r => r.classList.remove("on"));
  C.kEl = null; C.kSi = -1;
}
function paintWord(el, k) {
  if (el._k === k) return;
  el._k = k;
  let now = null;
  el.querySelectorAll(".w").forEach(w => {
    const n = +w.dataset.w;
    w.classList.toggle("now", n === k);
    w.classList.toggle("past", k >= 0 && n < k);
    if (n === k && !now) now = w;
  });
  if (now) keepInView(now);
}
function keepInView(w) {
  const box = w.closest(".f-body");
  if (!box || !w.getClientRects().length) return;
  const r = w.getBoundingClientRect(), b = box.getBoundingClientRect();
  if (r.top < b.top + 12 || r.bottom > b.bottom - 48) autoScroll(box, box.scrollTop + r.top - b.top - b.height * 0.35);
}
function autoScroll(box, top, now) {
  box._autoAt = performance.now();
  if (now) box.scrollTop = Math.max(0, top); else box.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
}
AU.onWord((si, k) => {
  if (!C.open || C.view !== 2 || !settings.karaoke || si < 0) { if (si < 0 || !settings.karaoke) clearKaraoke(); return; }
  if (C.kSi !== si) {
    clearKaraoke();
    const row = document.querySelector('.sn[data-si="' + si + '"]');
    if (!row) return;
    row.classList.add("on");
    C.kEl = row.querySelector(".sc");
    C.kSi = si;
    C.kEl.classList.add("reading");
  }
  if (C.kEl) paintWord(C.kEl, k);
});
/* 스크롤하다 실수로 문장이 눌리지 않게(영어일기 tapGuard 그대로): 손가락이 10px 넘게 움직였거나 관성 스크롤 중이면 무시 */
function tapGuard(box) {
  const g = { armed: false, down: false, moved: false, late: false, x: 0, y: 0, dragEnd: -1e9, flow: -1e9 };
  const opt = { passive: true };
  box.addEventListener("pointerdown", e => {
    g.armed = true; g.down = true; g.moved = false; g.x = e.clientX; g.y = e.clientY;
    g.late = performance.now() - g.flow < 250;
  }, opt);
  box.addEventListener("pointermove", e => { if (g.down && Math.hypot(e.clientX - g.x, e.clientY - g.y) > 10) g.moved = true; }, opt);
  const up = e => {
    if (!g.down) return;
    g.down = false;
    if (g.moved || e.type === "pointercancel") { g.moved = true; g.dragEnd = performance.now(); }
  };
  box.addEventListener("pointerup", up, opt);
  box.addEventListener("pointercancel", up, opt);
  box.addEventListener("scroll", () => {
    const t = performance.now();
    if (g.down || (t - g.dragEnd < 2000 && !((box._autoAt || -1e9) >= g.dragEnd))) g.flow = t;
  }, opt);
  return () => { const a = g.armed; g.armed = false; return !a || (!g.moved && !g.late); };
}

    '<p class="note">2단계 스크립트와 3단계 질문의 글자 크기예요.</p>' +
    '<div class="seg" role="group" aria-label="글자 크기" style="margin-top:12px">' +
    TEXT_ZOOMS.map((z, i) => '<button data-tz="' + z + '" aria-pressed="' + (settings.textZoom === z) + '">' + ["기본", "크게", "더 크게", "아주 크게"][i] + "</button>").join("") + "</div>" +
    '<div class="tz-prev" aria-hidden="true">They charged eighty dollars a night.</div></div>' +
    '<div class="st-sec"><h2>음성</h2>' +
    '<p class="note">챕터 음성은 앱에 미리 들어 있으면 그걸 써요(키 필요 없음). 없는 챕터는 ElevenLabs API 키가 있으면 새로 만들 수 있고(먼저 크레딧을 물어봐요), 키가 없으면 폰 기본 음성으로 읽어요. 한 번 만든 음성은 폰에 저장돼요.</p>' +
    '<label class="st-l" for="stKey">ElevenLabs API 키</label>' +
    '<div class="key-row"><input class="inp masked" id="stKey" type="text" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-lpignore="true" placeholder="키를 붙여넣으세요" value="' + esc(settings.apiKey) + '">' +
    '<button class="sub-btn" data-st="show" aria-pressed="false">보기</button></div>' +
    '<p class="key-state" id="stKeyState">' + keyState() + "</p>" +
    '<label class="st-l" for="stVoice">목소리(폰에서 새로 만들 때)</label><select class="sel" id="stVoice">' +
    EL_VOICES.map(v => '<option value="' + v.id + '"' + (v.id === settings.voice ? " selected" : "") + ">" + esc(v.name) + "</option>").join("") + "</select>" +
    '<label class="st-l" for="stModel">모델</label><select class="sel" id="stModel">' +
    EL_MODELS.map(v => '<option value="' + v.id + '"' + (v.id === settings.model ? " selected" : "") + ">" + esc(v.name) + "</option>").join("") + "</select>" +
    '<div class="st-l">기본 속도</div><div class="seg" role="group" aria-label="속도">' +
    RATES.map(r => '<button data-rate="' + r + '" aria-pressed="' + (settings.rate === r) + '">' + rateLabel(r) + "</button>").join("") + "</div>" +
    '<button class="outline-btn" data-st="try">' + IC.speaker + "목소리 들어보기</button>" +
    '<button class="outline-btn danger" data-st="clear">저장된 음성 지우기</button>' +
    '<p class="note">목소리 들어보기는 짧은 문장 하나(약 60자)를 만들어요.</p></div>';
}
function openSettings() {
  if (!$("settings").hidden) return;
  AU.stop();
  stRender();
  openLayer($("settings"), stHide);
  ST.body.scrollTop = 0;
}
function stHide() {
  clearTimeout(ST.keyT);
  saveSettings();
  if (C.open) paintPlayer(true);
}
ST.body.addEventListener("input", e => {
  if (e.target.id !== "stKey") return;
  clearTimeout(ST.keyT);
  ST.keyT = setTimeout(() => {
    settings.apiKey = e.target.value.replace(/\s+/g, "");
    saveSettings();
    $("stKeyState").innerHTML = keyState();
  }, 300);
});
ST.body.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "stVoice" && EL_VOICES.some(v => v.id === t.value)) settings.voice = t.value;
  else if (t.id === "stModel" && EL_MODELS.some(v => v.id === t.value)) settings.model = t.value;
  else return;
  saveSettings();
  buzz();
});
ST.body.addEventListener("click", e => {
  const b = e.target.closest("[data-st], [data-rate], [data-tz]");
  if (!b) return;
  if (b.dataset.rate) {
    const r = +b.dataset.rate;
    if (!RATES.includes(r)) return;
    settings.rate = r; saveSettings(); AU.setRate(r);
    ST.body.querySelectorAll("[data-rate]").forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.rate === r)));
    buzz(); return;
  }
  if (b.dataset.tz) {
    const z = +b.dataset.tz;
    if (!TEXT_ZOOMS.includes(z)) return;
    settings.textZoom = z; saveSettings(); applyTextZoom();
    ST.body.querySelectorAll("[data-tz]").forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.tz === z)));
    buzz(); return;
  }
  const a = b.dataset.st;
  if (a === "show") {
    const inp = $("stKey"), on = inp.classList.contains("masked");             // 비밀번호 칸이 아니라 가린 글 칸(폰이 비밀번호로 저장하자고 묻지 않게)
    inp.classList.toggle("masked", !on);
    b.textContent = on ? "숨기기" : "보기";
    b.setAttribute("aria-pressed", String(on));
  } else if (a === "try") {
    if (b.classList.contains("playing")) { AU.stop(); return; }
    const k = $("stKey").value.replace(/\s+/g, "");
    if (k !== settings.apiKey) { settings.apiKey = k; saveSettings(); $("stKeyState").innerHTML = keyState(); }
    AU.tryVoice(TRY_TEXT, b);
  } else if (a === "clear") {
    if (!ST.clearAsk) { ST.clearAsk = true; b.textContent = "한 번 더 누르면 지워요"; return; }
    AU.stop();
    AudioCache.clear();
    ST.clearAsk = false;
    b.textContent = "저장된 음성 지우기";
    toast("저장된 음성을 지웠어요");
  }
});

/* ---------- 앱 업데이트(영어일기와 같음) ----------
   sw.js는 늘 인터넷의 최신 파일을 먼저 받음 → 새 버전을 올릴 때마다 sw.js의 CACHE 숫자를 올림 →
   다시 화면으로 돌아올 때 새 서비스워커를 확인, 바뀌면 "새 버전이 나왔어요 [새로 고침]"(듣는 중일 수 있어서 저절로 새로 고치지 않음) */
const UPD = { had: false, reg: null };
$("updGo").addEventListener("click", () => { flushSave(); location.reload(); });
$("updX").addEventListener("click", () => { $("upd").hidden = true; });
function setupSW() {
  if (!("serviceWorker" in navigator)) return;
  UPD.had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (UPD.had) $("upd").hidden = false; UPD.had = true; });
  navigator.serviceWorker.register("sw.js").then(r => { UPD.reg = r; }).catch(() => {});
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && UPD.reg) UPD.reg.update().catch(() => {}); });
}
if (location.protocol === "https:") setupSW();

/* ---------- 시작: 인물 파일을 다 읽은 뒤 홈 ---------- */
READY.then(renderHome);
</script>
</body>
</html>
